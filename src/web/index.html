<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alienbin — secure ephemeral text sharing</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <img
          src="/logo.png"
          alt="Alienbin 외계인 마스코트"
          width="44"
          height="44"
        />
        <span>alienbin</span>
      </a>
      <nav>
        <a href="/" id="nav-new">New paste</a>
        <span class="lang-group" id="lang-toggle"></span>

    <main id="app">

      <noscript>Alienbin v2 requires JavaScript.</noscript>
    </main>

    <footer class="foot">
      <span>Ephemeral · Private · Disposable</span>
    </footer>

    <div id="toast-region" aria-live="polite"></div>
    <script type="module" src="./main.ts"></script>
